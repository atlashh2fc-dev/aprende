<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Comparación esquemática entre Point Smart 2 y Point Mini">
  <title>Point Smart 2 frente a Point Mini</title>
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="30" y="70" font-size="24" font-weight="700" fill="#0f1524">¿Cuál le</text>
  <text x="30" y="100" font-size="24" font-weight="700" fill="#0f1524">conviene?</text>
  <text x="30" y="132" font-size="18" fill="#0f1524">Datos al 09-10-2026</text>
  <!-- Point Smart 2 -->
  <rect x="345" y="38" width="60" height="18" rx="3" fill="#ffffff" stroke="#0f1524" stroke-width="2"/>
  <rect x="330" y="50" width="90" height="135" rx="14" fill="#0f1524"/>
  <rect x="340" y="64" width="70" height="88" rx="6" fill="#1E9FDC"/>
  <text x="375" y="118" text-anchor="middle" font-size="30" font-weight="700" fill="#0f1524">$</text>
  <circle cx="375" cy="168" r="7" fill="#eaeef2"/>
  <!-- Point Mini + celular -->
  <rect x="585" y="100" width="66" height="76" rx="14" fill="#0f1524"/>
  <path d="M607 128 a12 12 0 0 1 0 22 M614 122 a20 20 0 0 1 0 34 M621 116 a28 28 0 0 1 0 46" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <rect x="688" y="62" width="56" height="114" rx="10" fill="#ffffff" stroke="#0f1524" stroke-width="3"/>
  <rect x="696" y="74" width="40" height="80" rx="4" fill="#1E9FDC" fill-opacity="0.35"/>
  <path d="M653 140 H686" stroke="#1E9FDC" stroke-width="3" stroke-dasharray="4 4"/>
  <path d="M664 112 L676 124 L670 130 L670 104 L676 110 L664 122" fill="none" stroke="#1E9FDC" stroke-width="3" stroke-linejoin="round"/>
  <text x="375" y="214" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1524">Point Smart 2</text>
  <text x="660" y="214" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1524">Point Mini</text>
  <!-- filas -->
  <rect x="20" y="230" width="760" height="50" rx="8" fill="#eaeef2"/>
  <rect x="20" y="330" width="760" height="50" rx="8" fill="#eaeef2"/>
  <rect x="20" y="430" width="760" height="50" rx="8" fill="#eaeef2"/>
  <g font-size="18" font-weight="700" fill="#0f1524">
    <text x="34" y="261">Conexión</text>
    <text x="34" y="311">Comprobante</text>
    <text x="34" y="361">Débito al instante</text>
    <text x="34" y="411">Comisión</text>
    <text x="34" y="461">Además</text>
  </g>
  <g font-size="18" fill="#0f1524" text-anchor="middle">
    <text x="375" y="261">Chip 4G + Wi-Fi propios</text>
    <text x="660" y="261">Bluetooth al celular</text>
    <text x="375" y="311">Impreso, rollos gratis</text>
    <text x="660" y="311">Digital: correo o SMS</text>
    <text x="375" y="361">2,19% + IVA (bajo $2 MM)</text>
    <text x="660" y="361">2,95% + IVA</text>
    <text x="375" y="411" fill="#1FA877" font-weight="700">Baja por tramos</text>
    <text x="660" y="411">Fija, sin tramos</text>
    <text x="375" y="461">QR y tarjetas de alimentación</text>
    <text x="660" y="461">Montos de $100 a $8 MM</text>
  </g>
</svg>
