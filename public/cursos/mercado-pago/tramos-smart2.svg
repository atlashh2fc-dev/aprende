<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Tramos del Point Smart 2: a más venta mensual con tarjeta, menor comisión">
  <title>Tramos del Point Smart 2</title>
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="40" y="42" font-size="26" font-weight="700" fill="#0f1524">Point Smart 2: a más venta, menor comisión</text>
  <rect x="470" y="70" width="310" height="62" rx="12" fill="#F5A524" fill-opacity="0.15" stroke="#F5A524" stroke-width="2"/>
  <text x="625" y="98" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1524">Más de $25 MM al mes:</text>
  <text x="625" y="122" text-anchor="middle" font-size="18" fill="#0f1524">comisión especial (consultar)</text>
  <g fill="#1E9FDC">
    <rect x="60" y="130" width="160" height="230" rx="8"/>
    <rect x="230" y="175" width="160" height="185" rx="8" fill-opacity="0.75"/>
    <rect x="400" y="220" width="160" height="140" rx="8" fill-opacity="0.55"/>
    <rect x="570" y="265" width="160" height="95" rx="8" fill-opacity="0.35"/>
  </g>
  <g text-anchor="middle" fill="#0f1524">
    <text x="140" y="170" font-size="20" font-weight="700">2,19% débito</text>
    <text x="140" y="198" font-size="20" font-weight="700">2,69% crédito</text>
    <text x="140" y="226" font-size="18">al instante</text>
    <text x="310" y="212" font-size="19" font-weight="700">Ver página</text>
    <text x="480" y="257" font-size="19" font-weight="700">Ver página</text>
    <text x="650" y="302" font-size="19" font-weight="700">Ver página</text>
  </g>
  <path d="M40 362 H760" stroke="#0f1524" stroke-width="2"/>
  <g text-anchor="middle" font-size="18" font-weight="700" fill="#0f1524">
    <text x="140" y="390">Menos de $2 MM</text>
    <text x="310" y="390">$2 a $4 MM</text>
    <text x="480" y="390">$4 a $8 MM</text>
    <text x="650" y="390">Más de $8 MM</text>
  </g>
  <text x="400" y="430" text-anchor="middle" font-size="18" fill="#0f1524">Ventas mensuales con tarjeta en máquinas Point · MM = millones · tasas + IVA</text>
</svg>
