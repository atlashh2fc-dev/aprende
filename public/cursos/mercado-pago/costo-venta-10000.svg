<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="De una venta de 10.000 pesos con débito en Point Smart 2 se descuentan 260,61 pesos y el comercio recibe unos 9.739 pesos">
  <title>De dónde sale el costo de una venta</title>
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1524">Venta de $10.000 con débito en Point Smart 2</text>
  <text x="400" y="66" text-anchor="middle" font-size="18" fill="#0f1524">Dinero al instante · ventas bajo $2 millones al mes</text>
  <rect x="40" y="88" width="701" height="60" rx="6" fill="#1FA877"/>
  <rect x="741" y="88" width="16" height="60" fill="#1E9FDC"/>
  <rect x="757" y="88" width="3" height="60" fill="#F5A524"/>
  <text x="390" y="127" text-anchor="middle" font-size="24" font-weight="700" fill="#0f1524">Recibe $9.739 aprox.</text>
  <path d="M741 148 L100 210 M760 148 L700 210" stroke="#0f1524" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <rect x="100" y="210" width="504" height="64" rx="6" fill="#1E9FDC"/>
  <rect x="604" y="210" width="96" height="64" rx="6" fill="#F5A524"/>
  <text x="352" y="249" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1524">Comisión 2,19% = $219</text>
  <text x="652" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#0f1524">IVA</text>
  <text x="652" y="262" text-anchor="middle" font-size="18" fill="#0f1524">$41,61</text>
  <text x="400" y="306" text-anchor="middle" font-size="18" fill="#0f1524">El IVA (19%) se calcula sobre la comisión, no sobre la venta</text>
  <g text-anchor="middle" fill="#0f1524">
    <rect x="40" y="330" width="220" height="96" rx="12" fill="#eaeef2"/>
    <text x="150" y="376" font-size="30" font-weight="700">$10.000</text>
    <text x="150" y="406" font-size="18">venta</text>
    <rect x="290" y="330" width="220" height="96" rx="12" fill="#eaeef2"/>
    <text x="400" y="376" font-size="30" font-weight="700">− $260,61</text>
    <text x="400" y="406" font-size="18">descuento total</text>
    <rect x="540" y="330" width="220" height="96" rx="12" fill="#1FA877" fill-opacity="0.2" stroke="#1FA877" stroke-width="2"/>
    <text x="650" y="376" font-size="30" font-weight="700">= $9.739</text>
    <text x="650" y="406" font-size="18">recibe aprox.</text>
  </g>
</svg>
