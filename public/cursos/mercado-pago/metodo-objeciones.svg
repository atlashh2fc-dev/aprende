<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Método de cinco pasos para responder objeciones: escuchar, validar, preguntar, responder y confirmar">
  <title>Método para objeciones</title>
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f1524">Método para cualquier objeción</text>
  <text x="400" y="70" text-anchor="middle" font-size="18" fill="#0f1524">Una objeción no es un “no”: es una pregunta que aún no se resuelve</text>
  <path d="M100 160 H700" stroke="#eaeef2" stroke-width="10"/>
  <g>
    <circle cx="100" cy="160" r="48" fill="#eaeef2" stroke="#1E9FDC" stroke-width="3"/>
    <circle cx="250" cy="160" r="48" fill="#1E9FDC" fill-opacity="0.25" stroke="#1E9FDC" stroke-width="3"/>
    <circle cx="400" cy="160" r="48" fill="#1E9FDC" fill-opacity="0.5" stroke="#1E9FDC" stroke-width="3"/>
    <circle cx="550" cy="160" r="48" fill="#1E9FDC" fill-opacity="0.8" stroke="#1E9FDC" stroke-width="3"/>
    <circle cx="700" cy="160" r="48" fill="#1FA877" stroke="#1FA877" stroke-width="3"/>
  </g>
  <g text-anchor="middle" font-size="30" font-weight="700" fill="#0f1524">
    <text x="100" y="171">1</text><text x="250" y="171">2</text><text x="400" y="171">3</text><text x="550" y="171">4</text><text x="700" y="171">5</text>
  </g>
  <g text-anchor="middle" font-size="20" font-weight="700" fill="#0f1524">
    <text x="100" y="240">Escuchar</text><text x="250" y="240">Validar</text><text x="400" y="240">Preguntar</text><text x="550" y="240">Responder</text><text x="700" y="240">Confirmar</text>
  </g>
  <g text-anchor="middle" font-size="18" fill="#0f1524">
    <text x="100" y="270">sin</text><text x="100" y="294">interrumpir</text>
    <text x="250" y="270">“Entiendo, es</text><text x="250" y="294">razonable”</text>
    <text x="400" y="270">“¿Qué le</text><text x="400" y="294">preocupa?”</text>
    <text x="550" y="270">con datos</text><text x="550" y="294">verificables</text>
    <text x="700" y="270">“¿Eso resuelve</text><text x="700" y="294">su duda?”</text>
  </g>
  <rect x="30" y="330" width="740" height="92" rx="12" fill="#F5A524" fill-opacity="0.15" stroke="#F5A524" stroke-width="2"/>
  <text x="50" y="366" font-size="18" fill="#0f1524"><tspan font-weight="700">Nunca:</tspan> inventar una cifra, hablar mal de un competidor,</text>
  <text x="50" y="396" font-size="18" fill="#0f1524">prometer lo no publicado ni presionar con urgencias falsas.</text>
</svg>
