<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Ruta del dinero: venta con Point, cuenta Mercado Pago al instante o a 10 días, y luego transferencia al banco o pago con la tarjeta Mercado Pago">
  <title>La ruta del dinero</title>
  <rect width="800" height="430" fill="#ffffff"/>
  <text x="400" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#0f1524">La ruta del dinero</text>
  <rect x="25" y="150" width="160" height="100" rx="14" fill="#eaeef2"/>
  <text x="105" y="194" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1524">Venta</text>
  <text x="105" y="222" text-anchor="middle" font-size="21" font-weight="700" fill="#0f1524">con Point</text>
  <path d="M188 200 H292" stroke="#0f1524" stroke-width="3"/>
  <path d="M290 192 L304 200 L290 208 Z" fill="#0f1524"/>
  <text x="246" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#0f1524">Al instante</text>
  <text x="246" y="234" text-anchor="middle" font-size="18" fill="#0f1524">o a 10 días</text>
  <rect x="306" y="140" width="200" height="120" rx="14" fill="#1E9FDC"/>
  <text x="406" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1524">Cuenta</text>
  <text x="406" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="#0f1524">Mercado Pago</text>
  <text x="406" y="290" text-anchor="middle" font-size="18" fill="#0f1524">Gratis, sin banco</text>
  <path d="M508 180 L556 118 M508 220 L556 282" stroke="#0f1524" stroke-width="3" fill="none"/>
  <path d="M549 116 L562 110 L560 124 Z M549 284 L562 290 L560 276 Z" fill="#0f1524"/>
  <rect x="565" y="62" width="215" height="118" rx="14" fill="#1FA877" fill-opacity="0.18" stroke="#1FA877" stroke-width="2"/>
  <g text-anchor="middle" fill="#0f1524">
    <text x="672" y="96" font-size="20" font-weight="700">Transferir al banco</text>
    <text x="672" y="124" font-size="18">gratis; el contrato dice</text>
    <text x="672" y="150" font-size="18" font-weight="700">hasta 4 días hábiles</text>
  </g>
  <rect x="565" y="222" width="215" height="118" rx="14" fill="#1FA877" fill-opacity="0.18" stroke="#1FA877" stroke-width="2"/>
  <g text-anchor="middle" fill="#0f1524">
    <text x="672" y="256" font-size="20" font-weight="700">Pagar con la</text>
    <text x="672" y="282" font-size="18" font-weight="700">Tarjeta Mercado Pago</text>
    <text x="672" y="310" font-size="18">sin transferir</text>
  </g>
  <rect x="25" y="366" width="755" height="48" rx="12" fill="#F5A524" fill-opacity="0.15"/>
  <text x="400" y="397" text-anchor="middle" font-size="18" fill="#0f1524"><tspan font-weight="700">No confundir:</tspan> plazo de la venta (instante o 10 días) ≠ plazo de la transferencia</text>
</svg>
